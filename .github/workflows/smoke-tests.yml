name: Smoke Tests

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC daily
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  smoke-tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # Repairs the client/tutor test fixture accounts on staging before each
      # run -- otdev1602 carries a full production data sync, and per
      # docs/TESTING_REBUILD_SPEC.md §3.2 these fixture accounts are
      # deliberately kept OFF production, so every sync wipes them from
      # staging too (owl_system/docs/TESTING_SYSTEM.md's SSH/staging fixture
      # automation section). continue-on-error: if this step fails, the
      # actual test run below still gets a chance to run rather than the
      # whole workflow aborting on a repair step.
      # timeout-minutes: 8 (was 3) -- a first real CI run 3 Sept 2026 showed
      # each fresh SSH connection from this runner to WP Engine takes
      # 30-45s (much higher latency than testing locally), and the script
      # makes ~7 of them (connection reuse was tried and reverted -- see
      # recreate_staging_fixtures.sh -- WP Engine's SSH gateway didn't
      # tolerate it well). Worst case ~7*45s = 5.25 minutes; 8 gives real
      # headroom rather than cutting it close again.
      # Re-enabled 4 Sept 2026 -- a diagnostic run with this step fully
      # disabled (if: false) still got the same 403 on the first HTTP
      # request, disproving "the SSH burst needs to run in THIS execution to
      # cause it." Current best theory: the first time this step actually
      # authenticated (WPENGINE_SSH_PRIVATE_KEY was added 2026-09-03 10:26
      # UTC; the very next run 2 minutes later, 10:28 UTC, was the first
      # failure) tripped a standing block on WP Engine's side that has
      # persisted independent of this step ever since (confirmed via WP
      # Engine's own access log as a genuine nginx 403, not a 401 credentials
      # failure -- Password Protection, Global Edge Security, and Web Rules
      # all checked and ruled out). Since disabling this step doesn't clear
      # the block, there's no reason to keep it off -- see TO_DO.md for the
      # live status of the WP Engine support conversation.
      - name: Recreate staging test fixtures
        continue-on-error: true
        timeout-minutes: 8
        env:
          WPENGINE_SSH_PRIVATE_KEY: ${{ secrets.WPENGINE_SSH_PRIVATE_KEY }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
          TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
          TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
          TEST_MEET_NOW_TUTOR_ID: ${{ secrets.TEST_MEET_NOW_TUTOR_ID }}
        run: |
          umask 077
          printf '%s\n' "$WPENGINE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/wpengine_staging_key"
          chmod 600 "$RUNNER_TEMP/wpengine_staging_key"
          WPENGINE_SSH_KEY="$RUNNER_TEMP/wpengine_staging_key" bash scripts/recreate_staging_fixtures.sh

      # Cooldown before hitting the site again -- two real CI runs 3 Sept
      # 2026 both got a 403 Forbidden on the very first request of "Run
      # tests" (pytest_sessionstart enabling test_mode), immediately after
      # the fixture step's burst of ~7 SSH connections, and neither
      # happened on the prior run before that step existed. Looks like a
      # rate-limit/abuse-protection block on WP Engine's or a CDN's side
      # against the runner's IP, triggered by the connection burst, that
      # also catches the next HTTP request. A short pause here to let that
      # window clear is cheap to try before assuming anything more
      # structural is wrong.
      - name: Cooldown before test run
        run: sleep 90

      - name: Run tests
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_TUTOR_IDS: ${{ secrets.TEST_TUTOR_IDS }}
          TEST_MEET_NOW_TUTOR_ID: ${{ secrets.TEST_MEET_NOW_TUTOR_ID }}
          TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
          TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
          TEST_PREAPPLICANT_EMAIL: ${{ secrets.TEST_PREAPPLICANT_EMAIL }}
          TEST_PREAPPLICANT_PASSWORD: ${{ secrets.TEST_PREAPPLICANT_PASSWORD }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
        # --video=on records every test; utils/prune_videos.py below then
        # deletes anything that doesn't earn a place per
        # docs/TESTING_REBUILD_SPEC.md Day 8 (critical tests always, everything
        # else only on failure) rather than varying --video per test, which
        # pytest-playwright doesn't support.
        run: pytest --video=on --output=test-results --json-report --json-report-file=pytest-report.json -v
        continue-on-error: true

      - name: Prune non-critical passing videos
        run: python utils/prune_videos.py pytest-report.json test-results

      - name: Write results.json
        run: python utils/reporter.py pytest-report.json

      - name: Check for critical state changes and alert
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          OWL_TEST_API_KEY: ${{ secrets.OWL_TEST_API_KEY }}
          TEST_HTTP_USER: ${{ secrets.TEST_HTTP_USER }}
          TEST_HTTP_PASS: ${{ secrets.TEST_HTTP_PASS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin
          git show origin/results:results.json > previous_results.json 2>/dev/null || echo '{}' > previous_results.json
          python utils/check_critical_regressions.py previous_results.json results.json pytest-report.json

      - name: Push results to results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Set up results branch as a worktree so we never touch main
          git fetch origin
          if git ls-remote --exit-code origin results; then
            git worktree add /tmp/results origin/results
          else
            git worktree add --orphan -b results /tmp/results
          fi

          cp results.json /tmp/results/

          # Copy details.json if written by tests
          if [ -f "$GITHUB_WORKSPACE/details.json" ]; then
            cp details.json /tmp/results/
          fi

          # Copy any screenshots captured during the run
          if [ -d "$GITHUB_WORKSPACE/screenshots" ]; then
            mkdir -p /tmp/results/screenshots
            cp "$GITHUB_WORKSPACE/screenshots/"*.png /tmp/results/screenshots/ 2>/dev/null || true
          fi

          cd /tmp/results
          git add results.json details.json screenshots/
          git diff --staged --quiet || git commit -m "Test results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:results

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/**/*.webm
          # Day 8's storage decision (docs/TESTING_REBUILD_SPEC.md): GitHub
          # Actions artifacts with expiry, not committed to the results branch
          # — avoids the repo-bloat risk of committing video the way
          # screenshots are today. Each day's run is its own artifact, so
          # there's no accumulating path to prune — the previous day's videos
          # simply expire.
          retention-days: 14
          if-no-files-found: ignore
