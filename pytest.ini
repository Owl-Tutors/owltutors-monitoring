[pytest]
testpaths = tests
pythonpath = .
env_files = .env
markers =
    critical: business-critical — a failure here means real consequence (money not taken, a parent not contacted, office staff blocked, data silently wrong). Provisional best-guess tagging per docs/TESTING_REBUILD_SPEC.md Day 7; pending review with office staff.
    jobs: job creation and the client<->tutor connection flow (contact form, requested tutors, meet now, Stage 3/4)
    recruitment: tutor registration and application pipeline
    schools: school entrance guide listing and profile pages
    search: tutor search/listings and discovery filters
    tutors: logged-in tutor dashboard (jobs board, timesheets, availability, Stripe Connect)
    auth: login and account access
    content: blog, testimonials, shop, and group-course marketing pages
    papers: free exam papers catalogue
    analytics: GA4 tracking
    courses: group tuition checkout, payment, and enrolment (transactional, distinct from the marketing-page 'content' marker)
